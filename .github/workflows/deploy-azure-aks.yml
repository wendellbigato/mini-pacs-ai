name: Deploy to Azure AKS

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - 'inference_api/**'
      - 'k8s/**'
      - '.github/workflows/deploy-azure-aks.yml'
      - 'Dockerfile'
      - 'docker-compose.yml'

env:
  AZURE_REGION: eastus
  AKS_CLUSTER_NAME: mini-pacs-ai-cluster
  ACR_NAME: minpacsaiacr
  RESOURCE_GROUP: mini-pacs-ai-rg
  KUBECTL_VERSION: 'v1.28.0'

jobs:
  build-and-push:
    name: Build and Push Docker Image to ACR
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'deploy:azure')
    permissions:
      contents: read
      pull-requests: write

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      acr-login-server: ${{ steps.login-acr.outputs.login-server }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        id: login-acr
        run: |
          az acr login --name ${{ env.ACR_NAME }}
          echo "login-server=${{ env.ACR_NAME }}.azurecr.io" >> $GITHUB_OUTPUT

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_NAME }}.azurecr.io/mini-pacs-ai/inference-api
          tags: |
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./inference_api
          file: ./inference_api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Comment PR with image info
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### 🐳 Docker Image Built (Azure ACR)

            **Registry:** \`${{ steps.login-acr.outputs.login-server }}\`
            **Repository:** \`mini-pacs-ai/inference-api\`
            **Tags:**
            \`\`\`
            ${{ steps.meta.outputs.tags }}
            \`\`\`

            **Digest:** \`${{ steps.meta.outputs.digest }}\`
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  deploy-to-aks:
    name: Deploy to AKS Cluster
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Verify cluster connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy to Kubernetes
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          cd k8s/overlays/azure
          kustomize edit set image \
            mini-pacs-ai/inference-api=${{ needs.build-and-push.outputs.acr-login-server }}/mini-pacs-ai/inference-api:${{ env.IMAGE_TAG }}

          kustomize build . | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/azure-inference-api -n mini-pacs-ai --timeout=10m
          kubectl rollout status deployment/azure-orthanc -n mini-pacs-ai --timeout=5m
          kubectl rollout status deployment/azure-jupyter -n mini-pacs-ai --timeout=5m

      - name: Get service endpoints
        id: endpoints
        run: |
          echo "Waiting for LoadBalancers to be ready..."
          sleep 30

          ORTHANC_IP=$(kubectl get svc azure-orthanc -n mini-pacs-ai -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          API_IP=$(kubectl get svc azure-inference-api -n mini-pacs-ai -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          JUPYTER_IP=$(kubectl get svc azure-jupyter -n mini-pacs-ai -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

          echo "orthanc-endpoint=${ORTHANC_IP}" >> $GITHUB_OUTPUT
          echo "api-endpoint=${API_IP}" >> $GITHUB_OUTPUT
          echo "jupyter-endpoint=${JUPYTER_IP}" >> $GITHUB_OUTPUT

      - name: Run health checks
        run: |
          echo "Testing API health..."
          API_URL="http://${{ steps.endpoints.outputs.api-endpoint }}:8000"

          for i in {1..10}; do
            if curl -s "${API_URL}/health" | grep -q "healthy"; then
              echo "✅ API is healthy!"
              break
            fi
            echo "Waiting for API... (attempt $i/10)"
            sleep 10
          done

          curl -s "${API_URL}/health" | jq .

      - name: Comment PR with deployment info
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### 🚀 Deployment to Azure AKS Successful

            **Cluster:** \`${{ env.AKS_CLUSTER_NAME }}\`
            **Region:** \`${{ env.AZURE_REGION }}\`
            **Resource Group:** \`${{ env.RESOURCE_GROUP }}\`
            **Namespace:** \`mini-pacs-ai\`

            #### 📡 Service Endpoints

            | Service | Endpoint |
            |---------|----------|
            | 🏥 Orthanc PACS | http://${{ steps.endpoints.outputs.orthanc-endpoint }}:8042 |
            | 🤖 Inference API | http://${{ steps.endpoints.outputs.api-endpoint }}:8000 |
            | 📚 API Docs (Swagger) | http://${{ steps.endpoints.outputs.api-endpoint }}:8000/docs |
            | 📓 Jupyter Notebook | http://${{ steps.endpoints.outputs.jupyter-endpoint }}:8888 |

            #### 🔍 Verify Deployment

            \`\`\`bash
            # Set AKS context
            az aks get-credentials --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.AKS_CLUSTER_NAME }}

            # Get pods status
            kubectl get pods -n mini-pacs-ai

            # Test API
            curl http://${{ steps.endpoints.outputs.api-endpoint }}:8000/health
            \`\`\`

            #### 🧪 Test Endpoints

            \`\`\`bash
            # Test prediction
            curl -X POST http://${{ steps.endpoints.outputs.api-endpoint }}:8000/predict \\
              -F "dicom_file=@exam.dcm"

            # Test mask generation
            curl -X POST http://${{ steps.endpoints.outputs.api-endpoint }}:8000/generate_masks \\
              -F "dicom_file=@exam.dcm"
            \`\`\`
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Deployment summary
        run: |
          echo "## ✅ Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cluster:** ${{ env.AKS_CLUSTER_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** ${{ env.AZURE_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Resource Group:** ${{ env.RESOURCE_GROUP }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ needs.build-and-push.outputs.acr-login-server }}/mini-pacs-ai/inference-api:${{ needs.build-and-push.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Service Endpoints" >> $GITHUB_STEP_SUMMARY
          echo "- **Orthanc:** http://${{ steps.endpoints.outputs.orthanc-endpoint }}:8042" >> $GITHUB_STEP_SUMMARY
          echo "- **API:** http://${{ steps.endpoints.outputs.api-endpoint }}:8000" >> $GITHUB_STEP_SUMMARY
          echo "- **Jupyter:** http://${{ steps.endpoints.outputs.jupyter-endpoint }}:8888" >> $GITHUB_STEP_SUMMARY

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build-and-push.outputs.acr-login-server }}/mini-pacs-ai/inference-api:${{ needs.build-and-push.outputs.image-tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
