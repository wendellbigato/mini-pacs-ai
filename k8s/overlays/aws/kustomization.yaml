apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mini-pacs-ai

bases:
  - ../../base

namePrefix: aws-

commonLabels:
  cloud-provider: aws
  deployment-target: eks

patchesStrategicMerge:
  - orthanc-pvc-patch.yaml
  - orthanc-service-patch.yaml
  - inference-api-service-patch.yaml
  - jupyter-service-patch.yaml

images:
  - name: mini-pacs-ai/inference-api
    newName: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/mini-pacs-ai/inference-api
    newTag: ${IMAGE_TAG}

configMapGenerator:
  - name: aws-config
    literals:
      - AWS_REGION=${AWS_REGION}
      - ENVIRONMENT=production
