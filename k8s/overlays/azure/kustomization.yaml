apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mini-pacs-ai

bases:
  - ../../base

namePrefix: azure-

commonLabels:
  cloud-provider: azure
  deployment-target: aks

patchesStrategicMerge:
  - orthanc-pvc-patch.yaml
  - orthanc-service-patch.yaml
  - inference-api-service-patch.yaml
  - jupyter-service-patch.yaml

images:
  - name: mini-pacs-ai/inference-api
    newName: ${ACR_NAME}.azurecr.io/mini-pacs-ai/inference-api
    newTag: ${IMAGE_TAG}

configMapGenerator:
  - name: azure-config
    literals:
      - AZURE_REGION=${AZURE_REGION}
      - ENVIRONMENT=production
