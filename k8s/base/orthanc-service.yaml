apiVersion: v1
kind: Service
metadata:
  name: orthanc
  namespace: mini-pacs-ai
  labels:
    app: orthanc
    component: pacs
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8042
    targetPort: 8042
    protocol: TCP
  - name: dicom
    port: 4242
    targetPort: 4242
    protocol: TCP
  selector:
    app: orthanc
