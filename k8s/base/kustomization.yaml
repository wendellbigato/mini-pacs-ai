apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mini-pacs-ai

resources:
  - namespace.yaml
  - orthanc-pvc.yaml
  - orthanc-deployment.yaml
  - orthanc-service.yaml
  - inference-api-deployment.yaml
  - inference-api-service.yaml
  - jupyter-deployment.yaml
  - jupyter-service.yaml

commonLabels:
  app.kubernetes.io/name: mini-pacs-ai
  app.kubernetes.io/version: "1.3.0"

images:
  - name: mini-pacs-ai/inference-api
    newName: mini-pacs-ai/inference-api
    newTag: latest
