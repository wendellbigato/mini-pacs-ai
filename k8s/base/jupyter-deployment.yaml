apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter
  namespace: mini-pacs-ai
  labels:
    app: jupyter
    component: notebook
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jupyter
  template:
    metadata:
      labels:
        app: jupyter
        component: notebook
    spec:
      containers:
      - name: jupyter
        image: mini-pacs-ai/jupyter:latest
        ports:
        - containerPort: 8888
          name: http
          protocol: TCP
        env:
        - name: ORTHANC_URL
          value: "http://orthanc:8042"
        - name: API_URL
          value: "http://inference-api:8000"
        - name: JUPYTER_ENABLE_LAB
          value: "yes"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api
            port: 8888
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /api
            port: 8888
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - name: notebooks
          mountPath: /workspace
      volumes:
      - name: notebooks
        emptyDir: {}
